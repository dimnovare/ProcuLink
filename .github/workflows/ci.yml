name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant PR runs. NEVER cancel a post-merge run on main.
#
# The old form was `group: ci-${{ github.ref }}` + `cancel-in-progress: true`. Every
# merge to main shares the ref `refs/heads/main`, so each merge cancelled the
# PREVIOUS commit's post-merge run. On 2026-07-30 five voided main runs were
# observed across this repo and the frontend in one afternoon — BE #83 cancelled
# ~25s in when BE #76 landed, BE #79 the same when BE #85 landed, plus FE #54's
# Playwright job and FE #53 / FE #43 killed at 29s and 14s. A `cancelled` conclusion
# is not a pass and not a failure: it is no information, and it silently removed the
# only check that runs against the tree that actually shipped.
#
# Setting `cancel-in-progress: false` alone does NOT fix it. Per the workflow-syntax
# docs: "any existing `pending` job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place." During a merge
# train that still loses every run but the first in-progress and the last queued. So
# the GROUP has to differ per commit.
#
#   pull_request → group by ref, so a new push to a PR cancels its own older run.
#                  That cancelling is the point: the older run tests a tree nobody
#                  will merge.
#   push (main)  → group by SHA. Unique per commit, so no merge can cancel another
#                  commit's verification, and runs proceed in parallel rather than
#                  queueing behind each other.
#
# `cancel-in-progress` is still set from an expression rather than dropped, so the
# PR path keeps its old behaviour exactly.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test (213 baseline)
    runs-on: ubuntu-latest
    # Measured 2026-08-06 across the last 10 green runs. Two clocks matter and they are not the
    # same clock, which is the whole reason this setting was mis-sized:
    #
    #   steps  — first step start to last step end: 11.55, 12.13, 12.13, 12.25, 12.55,
    #            12.58, 12.82, 12.87, 12.88, 14.17 minutes. Stable, and NOT what the cap reads.
    #   job    — what `timeout-minutes` actually bounds. Normally the steps plus 3-5 seconds of
    #            runner overhead, so the two agree. On four runs today it did not: the runner
    #            stalled 2.6-3.4 MINUTES outside the step timeline, in the same window GitHub was
    #            also returning "not acquired by Runner of type hosted" and failing `Set up job`.
    #
    # That stall has a name. githubstatus.com logged "Incident with Actions", impact critical, from
    # 2026-08-06 15:22:49 UTC — twenty-one minutes before the first run this killed — reporting
    # throttled workflow triggers and "runners are stuck retrying unavailable jobs". So the runs
    # were not slow, they were waiting on a provider incident, and a cap this tight reports that
    # incident as a failing pull request. Incidents recur; the cap should survive the next one.
    #
    # That stall, not the suite, is what killed green work. Run 31117088351 attempt 1 (PR #157)
    # finished all thirteen steps green in 12m39s — Test itself took 11m00s — and was cancelled
    # anyway at a 16m12s job clock. Runs 31118298579 and 31118266459 died the same way at 12m38s
    # and 12m08s of steps. Run 31118326565 survived at 15m33s only because its stall was 2.6m
    # rather than 3.4m. A 15-minute cap on a 12.5-minute suite has no room for a 3-minute stall,
    # so it converts an Actions incident into a red PR on work that passed.
    #
    # 25 absorbs a ~3-minute stall on a suite that has already touched 14.17 minutes on its own,
    # and still kills a genuinely hung job long before it burns an hour of runner time.
    #
    # The suite was also nowhere near its floor, which is why this is a cap change and not an
    # excuse. The trx said Test was 10m39s of a 12m08s step span, and 538s of that was 56 Postgres
    # classes each starting their OWN postgres:16 container for 25.2s of real test work — they
    # shared the `postgres-container` collection, so those 56 starts ran end to end on the critical
    # path. #168 gives that collection an ICollectionFixture holding one container: run 31127050382
    # measured Test at 157s and the whole job at 4m20s, with the Api.Tests count unchanged at
    # 2232/1 skipped and Σ test durations UP (312.3s → 339.1s). Faster because the container starts
    # are gone, not because anything stopped running.
    #
    # 25 is deliberately not re-tightened to track that. A cap's job is to kill a hung job, not to
    # sit just above the runtime — sitting just above the runtime is the bug being fixed here. It
    # also has to hold whichever of these two PRs lands first, and if the container fix is ever
    # reverted the suite is back at 12.5 minutes. If runs ever approach 25, read the trx artifact
    # this workflow already uploads and find what got slower. Do not raise this again.
    timeout-minutes: 25

    # WHY THIS JOB CHECKS OUT THE FRONTEND.
    #
    # EndpointReachabilityGuardTests asks "does anything call this endpoint?", and only
    # project-proculink can answer the second half: the callers are ~160 fetch sites across
    # src/lib/api-client.ts, seven modules under src/lib/api/ and scripts/live-matrix/. Without
    # that checkout the guard cannot run at all — and it deliberately does NOT degrade to a skip.
    #
    # The audit that commissioned it (docs/superpowers/plans/2026-07-27-v1-master-plan/
    # AUDIT-2026-08-06-V2.md §3) named the alternative by name: backendMirror.test.ts is
    # `skipIf(!BACKEND)`, frontend CI never checked the backend out, and it reported green for
    # months having compared nothing. A cross-repo guard is either supplied with the other side or
    # it is theatre. This is the supply.
    #
    # dimnovare/project-proculink is a PUBLIC repository, so actions/checkout reads it with the
    # automatically-provisioned GITHUB_TOKEN — no secret, no PAT, nothing to rotate, and it works
    # unchanged on a fork PR. If it is ever made private this checkout 404s and the job goes RED,
    # which is the correct direction to fail; the fix would be a read-only fine-grained PAT passed
    # as `token:`, not a skip.
    #
    # NO `ref:` IS PINNED, DELIBERATELY. The checkout follows the frontend's DEFAULT BRANCH, because
    # the guard exists to catch a caller DISAPPEARING and a pinned mirror only re-confirms the
    # moment it was pinned. The consequence is real and intended: a frontend PR that deletes the
    # last call site for an endpoint turns this job red on the backend. That red is the finding —
    # an endpoint nobody can reach — and the fix is to restore the caller, delete the endpoint, or
    # declare it in EndpointReachabilityGuardTests with a written reason.
    #
    # WHY IT LANDS UNDER `.claude/`, WHICH IS NOT ITS USUAL MEANING.
    #
    # actions/checkout can only write inside the workspace, so the frontend ends up inside the
    # BACKEND repo — and two architecture guards here walk `*.cs` from the repo root:
    # RetiredSubsystemsStayRetiredTests.SourceFiles and
    # RevisionAuthorityHostCoverageTests.ProductionSourceFiles. The frontend carries one tracked
    # C# file, src/test/fixtures/backendCopy/SampleService.cs, deliberately stuffed with the
    # phrases those scanners hunt for; at a top-level path it would be read as a production
    # project of this repo. `.claude/` is the one prefix EVERY source scan in this repository
    # already excludes — they all do it because parallel sessions keep full repo COPIES under
    # `.claude/worktrees/`, and a foreign checkout is exactly that problem again. Reusing the
    # existing exclusion beats adding a new one to three scanners and hoping the fourth remembers.
    #
    # Reproduce locally with the two repositories side by side (nothing to configure), or:
    #   PROCULINK_FRONTEND_PATH=/path/to/project-proculink \
    #     dotnet test ProcuLink.Api.Tests --filter FullyQualifiedName~EndpointReachability
    env:
      PROCULINK_FRONTEND_PATH: ${{ github.workspace }}/.claude/frontend-checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout frontend (dimnovare/project-proculink, default branch)
        uses: actions/checkout@v5
        with:
          repository: dimnovare/project-proculink
          path: .claude/frontend-checkout
          fetch-depth: 1
          # Both repos went PRIVATE on 2026-08-13, and the default GITHUB_TOKEN is scoped
          # to its own repository — so this checkout began failing with a 404, taking the
          # endpoint-reachability guard with it. Fine-grained PAT, Contents:read on both.
          #
          # If this ever fails with "Repository not found", check the token's EXPIRY before
          # anything else: it is the one part of this job that dies on a calendar rather
          # than on a code change, and the symptom is identical to the repo being renamed.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Record which frontend commit the reachability guard ran against
        run: |
          SHA="$(git -C .claude/frontend-checkout rev-parse HEAD)"
          echo "Endpoint reachability checked against dimnovare/project-proculink @ ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint reachability checked against dimnovare/project-proculink @ ${SHA}"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ProcuLink.slnx

      - name: Build (Release)
        run: dotnet build ProcuLink.slnx --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test ProcuLink.slnx \
            --no-restore \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=test-results.trx"

      # A skip nobody reads is the next silent pass.
      #
      # `console;verbosity=normal` prints "Skipped: 7" and stops there — not which tests,
      # and not why. That is the same reporting hole WP-02 exists to close, one level up:
      # Live_ImapIngress reported Passed for two and a half weeks, and the fix (a declared
      # [EnvironmentGatedFact] skip) only helps if the skip is legible. A typo'd variable
      # name in a gating attribute would otherwise skip that test forever, in silence.
      #
      # So: name every skipped test and its reason in the job summary, and FAIL on a skip
      # with no reason at all — "Skipped" with an empty message is indistinguishable from
      # a test that quietly stopped existing.
      - name: Skip census — name every skipped test and its reason
        if: always()
        run: |
          pip install --quiet defusedxml
          python3 - <<'PY'
          import glob, os, sys
          from defusedxml import ElementTree as ET

          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          files = glob.glob('**/TestResults/*.trx', recursive=True)
          if not files:
              print('::error::No .trx produced — the skip census cannot read the run, so it must not report a pass.')
              sys.exit(1)

          skipped, reasonless = [], []
          for path in files:
              for result in ET.parse(path).getroot().iter(f'{NS}UnitTestResult'):
                  if result.get('outcome') not in ('NotExecuted', 'Skipped'):
                      continue
                  name = result.get('testName', '(unnamed)')
                  message = result.findtext(f'{NS}Output/{NS}ErrorInfo/{NS}Message', default='').strip()
                  skipped.append((name, message))
                  if not message:
                      reasonless.append(name)

          skipped.sort()
          print(f'{len(skipped)} skipped test(s) in this run:\n')
          for name, message in skipped:
              print(f'  SKIPPED  {name}\n           {message or "(NO REASON GIVEN)"}\n')

          summary = ['## Skipped tests', '', f'{len(skipped)} skipped in this run.', '']
          summary += [f'- `{n}` — {m or "**no reason given**"}' for n, m in skipped]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('\n'.join(summary) + '\n')

          for name in reasonless:
              print(f'::error::{name} is skipped with no reason. A skip must name what to set or fix.')
          sys.exit(1 if reasonless else 0)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
