[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = ["dotnet restore ProcuLink.Api/ProcuLink.Api.csproj"]

[phases.build]
cmds = ["dotnet publish ProcuLink.Api/ProcuLink.Api.csproj --no-restore -c Release -o out"]

[start]
# PORT is injected by Railway at runtime; the shell expands it here (not in TOML variables)
cmd = "ASPNETCORE_URLS=http://+:$PORT dotnet /app/out/ProcuLink.Api.dll"
