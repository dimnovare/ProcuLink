<?xml version="1.0"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" fill="none" role="img" aria-label="ProcuLink — Connecting Procurement">
  <title>ProcuLink — Connecting Procurement</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1A2F"></stop>
      <stop offset="100%" stop-color="#10243E"></stop>
    </linearGradient>
    <linearGradient id="spine" x1="0" x2="1">
      <stop offset="0%" stop-color="#1E66C9"></stop>
      <stop offset="100%" stop-color="#2E8E3A"></stop>
    </linearGradient>
    <pattern id="dotgrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.10"></circle>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"></rect>
  <rect width="1584" height="396" fill="url(#dotgrid)"></rect>

  
  <rect x="0" y="197" width="1584" height="2" fill="url(#spine)" opacity="0.50"></rect>

  
  <g transform="translate(140, 118) scale(4)">
    <path d="M8 10h14a10 10 0 0 1 10 10v0a10 10 0 0 1-10 10H8" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none"></path>
    <circle cx="8" cy="10" r="2.5" fill="#FFFFFF"></circle>
    <circle cx="8" cy="30" r="2.5" fill="#FFFFFF"></circle>
  </g>

  
  <text x="330" y="190" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="68" letter-spacing="-0.02em" fill="#FFFFFF">ProcuLink</text>
  <text x="330" y="240" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" letter-spacing="0.05em" fill="#C5D2E4">CONNECTING PROCUREMENT</text>
  <text x="330" y="280" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#7C8DA6">The missing link between buyers and suppliers.</text>

  
  <g transform="translate(1080, 160)">
    <rect x="0" y="0" width="180" height="36" rx="6" stroke="#1E66C9" stroke-width="1.5" fill="rgba(30,102,201,0.08)"></rect>
    <rect x="0" y="0" width="3" height="36" fill="#1E66C9"></rect>
    <text x="14" y="22" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Buyer · Heinrich</text>
    <line x1="180" y1="18" x2="280" y2="18" stroke="url(#spine)" stroke-width="2"></line>
    <rect x="280" y="0" width="180" height="36" rx="6" stroke="#2E8E3A" stroke-width="1.5" fill="rgba(46,142,58,0.08)"></rect>
    <rect x="457" y="0" width="3" height="36" fill="#2E8E3A"></rect>
    <text x="294" y="22" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Supplier · Acme</text>
  </g>
</svg>