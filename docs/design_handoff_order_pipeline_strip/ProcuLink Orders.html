<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440, initial-scale=1"/>
  <title>ProcuLink · Orders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="orders/tokens.css"/>
  <style>
    /* @om-edit-overrides not generated yet */
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--bg);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }
    button { font: inherit; cursor: pointer; }
    input { font: inherit; color: inherit; }
    input::placeholder { color: var(--ink-faint); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(11,26,47,0.12); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(11,26,47,0.22); background-clip: padding-box; border: 2px solid transparent; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    // Tweak defaults — host can rewrite this JSON between the markers.
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "compact",
      "view": "detail"
    }/*EDITMODE-END*/;
    window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
  </script>

  <script type="text/babel" src="orders/tweaks-panel.jsx"></script>
  <script type="text/babel" src="orders/data.jsx"></script>
  <script type="text/babel" src="orders/components.jsx"></script>
  <script type="text/babel" src="orders/screen-orders.jsx"></script>
  <script type="text/babel" src="orders/screen-order.jsx"></script>
  <script type="text/babel" src="orders/app.jsx"></script>
</body>
</html>
